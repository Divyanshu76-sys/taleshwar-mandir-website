<html lang="hi"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<title>वीडियो | श्री तालेश्वर महादेव मंदिर</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="./videos_files/css2" rel="stylesheet">
<script type="text/javascript" src="./videos_files/netlify-identity-widget.js.download"></script>
<style>
  :root {
    --maroon:#7A1F1F; --maroon-deep:#5C1414; --saffron:#E8A317; --gold:#C9962E;
    --cream:#FFF8ED; --cream-warm:#FBF1DD; --charcoal:#2B2320;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--cream); color:var(--charcoal); font-family:'Mukta', sans-serif; }
  .wrap { max-width:1000px; margin:0 auto; padding:40px 20px 80px; }
  .back { display:inline-flex; align-items:center; gap:8px; color:var(--maroon); text-decoration:none; font-weight:600; margin-bottom:24px; font-size:1rem; }
  h1 { font-family:'Eczar',serif; color:var(--maroon-deep); text-align:center; font-size:2.2rem; margin:0 0 8px; }
  .subtitle { text-align:center; color:var(--maroon); font-family:'Tiro Devanagari Hindi',serif; font-size:1.1rem; margin-bottom:36px; }

  .admin-box {
    background:var(--cream-warm); border:2px dashed var(--gold); border-radius:14px;
    padding:24px; margin:0 auto 40px; max-width:600px; display:none;
  }
  .admin-box.show { display:block; }
  .admin-box h3 { margin-top:0; color:var(--maroon-deep); font-family:'Eczar',serif; }
  .admin-box input[type="text"], .admin-box input[type="file"] {
    width:100%; padding:10px 12px; margin-bottom:12px; border:1px solid var(--gold);
    border-radius:8px; font-family:'Mukta',sans-serif; font-size:1rem;
  }
  .admin-box button {
    background:var(--maroon); color:#fff; border:none; padding:12px 24px;
    border-radius:8px; font-weight:600; cursor:pointer; font-size:1rem;
  }
  .admin-box button:disabled { background:#aaa; cursor:not-allowed; }
  .progress-wrap { background:#eee; border-radius:6px; overflow:hidden; height:10px; margin:10px 0; display:none; }
  .progress-bar { background:var(--saffron); height:100%; width:0%; transition:width 0.2s; }
  .status-msg { font-size:0.95rem; margin-top:8px; }

  .login-bar { text-align:center; margin-bottom:24px; }
  .login-bar button {
    background:var(--maroon-deep); color:#fff; border:none; padding:10px 18px;
    border-radius:8px; cursor:pointer; font-weight:600;
  }

  .gallery { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px,1fr)); gap:20px; }
  .video-card {
    background:var(--cream-warm); border-radius:12px; overflow:hidden;
    box-shadow:0 6px 18px rgba(122,31,31,0.12); border-left:4px solid var(--saffron);
  }
  .video-card video { width:100%; display:block; background:#000; }
  .video-card .caption {
    padding:12px 14px; font-family:'Tiro Devanagari Hindi',serif;
    color:var(--maroon-deep); font-size:1.05rem;
  }
  .empty-msg, .loading-msg {
    text-align:center; color:var(--maroon); font-family:'Tiro Devanagari Hindi',serif;
    font-size:1.1rem; padding:40px 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="file:///C:/Users/kulaj/Downloads/index.html">← मंदिर पृष्ठ पर वापस जाएँ</a>
  <h1>🎥 मंदिर वीडियो</h1>
  <div class="subtitle">दर्शन, आरती और उत्सव के वीडियो यहाँ देखें</div>

  <div class="login-bar" id="loginBar"><button id="adminLoginBtn">Admin Login</button></div>

  <div class="admin-box" id="adminBox">
    <h3>🎬 नया वीडियो अपलोड करें</h3>
    <input type="text" id="videoTitle" placeholder="वीडियो का शीर्षक (जैसे: श्रावण सोमवार आरती)">
    <input type="file" id="videoFile" accept="video/*">
    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <button id="uploadBtn">अपलोड करें</button>
    <div class="status-msg" id="statusMsg"></div>
  </div>

  <div id="galleryContainer"><div class="empty-msg">वीडियो लोड करने में समस्या आई। कृपया बाद में पुनः प्रयास करें।</div></div>
</div>

<script>
  // ── Netlify Identity: show admin login / upload box only for logged-in users ──
  function refreshAdminUI() {
    const user = window.netlifyIdentity && window.netlifyIdentity.currentUser();
    const loginBar = document.getElementById('loginBar');
    const adminBox = document.getElementById('adminBox');
    if (user) {
      loginBar.innerHTML = '<button id="adminLogoutBtn">Logout (' + (user.email || 'Admin') + ')</button>';
      document.getElementById('adminLogoutBtn').onclick = () => window.netlifyIdentity.logout();
      adminBox.classList.add('show');
    } else {
      loginBar.innerHTML = '<button id="adminLoginBtn">Admin Login</button>';
      document.getElementById('adminLoginBtn').onclick = () => window.netlifyIdentity.open();
      adminBox.classList.remove('show');
    }
  }

  document.addEventListener('DOMContentLoaded', function () {
    if (window.netlifyIdentity) {
      window.netlifyIdentity.on('init', refreshAdminUI);
      window.netlifyIdentity.on('login', refreshAdminUI);
      window.netlifyIdentity.on('logout', refreshAdminUI);
      window.netlifyIdentity.init();
    }
    document.getElementById('adminLoginBtn').onclick = () => window.netlifyIdentity && window.netlifyIdentity.open();

    loadGallery();
  });

  // ── Upload flow: get signature from our function, then upload straight to Cloudinary ──
  document.getElementById('uploadBtn').addEventListener('click', async function () {
    const fileInput = document.getElementById('videoFile');
    const titleInput = document.getElementById('videoTitle');
    const statusMsg = document.getElementById('statusMsg');
    const progressWrap = document.getElementById('progressWrap');
    const progressBar = document.getElementById('progressBar');
    const uploadBtn = document.getElementById('uploadBtn');

    if (!fileInput.files.length) {
      statusMsg.textContent = 'कृपया पहले कोई वीडियो फ़ाइल चुनें।';
      return;
    }

    uploadBtn.disabled = true;
    statusMsg.textContent = 'तैयारी हो रही है...';

    try {
      const sigRes = await fetch('/.netlify/functions/get-upload-signature');
      const sigData = await sigRes.json();
      if (sigData.error) throw new Error(sigData.error);

      const formData = new FormData();
      formData.append('file', fileInput.files[0]);
      formData.append('api_key', sigData.apiKey);
      formData.append('timestamp', sigData.timestamp);
      formData.append('signature', sigData.signature);
      formData.append('folder', sigData.folder);
      formData.append('tags', sigData.tags);
      if (titleInput.value.trim()) {
        formData.append('context', 'title=' + titleInput.value.trim());
      }

      progressWrap.style.display = 'block';
      statusMsg.textContent = 'अपलोड हो रहा है...';

      await new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('POST', `https://api.cloudinary.com/v1_1/${sigData.cloudName}/video/upload`);
        xhr.upload.onprogress = (e) => {
          if (e.lengthComputable) {
            progressBar.style.width = Math.round((e.loaded / e.total) * 100) + '%';
          }
        };
        xhr.onload = () => {
          if (xhr.status >= 200 && xhr.status < 300) resolve();
          else reject(new Error('Upload fail hua: ' + xhr.responseText));
        };
        xhr.onerror = () => reject(new Error('Network error aaya upload ke dauraan.'));
        xhr.send(formData);
      });

      statusMsg.textContent = '✅ वीडियो सफलतापूर्वक अपलोड हो गया!';
      fileInput.value = '';
      titleInput.value = '';
      progressWrap.style.display = 'none';
      progressBar.style.width = '0%';
      loadGallery();
    } catch (err) {
      statusMsg.textContent = '❌ ' + err.message;
    } finally {
      uploadBtn.disabled = false;
    }
  });

  // ── Public gallery: fetch and render all tagged videos ──
  async function loadGallery() {
    const container = document.getElementById('galleryContainer');
    try {
      const res = await fetch('/.netlify/functions/list-videos');
      const data = await res.json();
      if (data.error) throw new Error(data.error);

      const videos = data.videos || [];
      if (!videos.length) {
        container.innerHTML = '<div class="empty-msg">अभी तक कोई वीडियो अपलोड नहीं हुआ है। जल्द ही यहाँ वीडियो जोड़े जाएंगे।</div>';
        return;
      }

      const grid = document.createElement('div');
      grid.className = 'gallery';
      videos.forEach((v) => {
        const card = document.createElement('div');
        card.className = 'video-card';
        card.innerHTML = `
          <video controls preload="metadata" poster="${v.thumbnail}">
            <source src="${v.url}" type="video/mp4">
          </video>
          <div class="caption">${v.title}</div>
        `;
        grid.appendChild(card);
      });
      container.innerHTML = '';
      container.appendChild(grid);
    } catch (err) {
      container.innerHTML = '<div class="empty-msg">वीडियो लोड करने में समस्या आई। कृपया बाद में पुनः प्रयास करें।</div>';
    }
  }
</script>
